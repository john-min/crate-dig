[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cratedig-engine"
version = "0.1.0"
description = "Crate Dig audio analysis, clustering, and Rekordbox import/export engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Crate Dig" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.6",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
fast = [
  "librosa>=0.10",
  "soundfile>=0.12",
]
deep = [
  "cratedig-engine[fast]",
  "torch>=2.2",
  "transformers>=4.40",
]
essentia = [
  "essentia",
]
discogs-effnet = [
  "essentia-tensorflow==2.1b6.dev1389",
]
cluster-quality = [
  "umap-learn>=0.5",
  "hdbscan>=0.8",
]
job = [
  "cratedig-engine[fast]",
  "supabase>=2.9",
  "boto3>=1.34",
]
dev = [
  "pytest>=8.0",
  "cratedig-engine[fast]",
]

[project.scripts]
cratedig-engine = "cratedig_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cratedig_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

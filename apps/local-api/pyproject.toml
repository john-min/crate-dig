[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cratedig-local-api"
version = "0.1.0"
description = "Localhost FastAPI: library index and disk playback from stored file paths"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Crate Dig" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
cratedig-local-api = "cratedig_local_api.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cratedig_local_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

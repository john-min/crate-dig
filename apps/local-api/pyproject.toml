[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cratedig-local-api"
version = "0.1.0"
description = "Localhost FastAPI: library index and disk playback from stored file paths"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Crate Dig" }]
dependencies = [
  "cratedig-engine[fast]",
  "fastapi>=0.115",
  "pyrekordbox>=0.4.4",
  "rekordbox-pdb",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
cratedig-local-api = "cratedig_local_api.app:main"
cratedig-local-worker = "cratedig_local_api.worker:main"
cratedig-materialize-neighbors = "cratedig_local_api.similarity:main"
cratedig-hydrate-cloud-library = "cratedig_local_api.cloud_hydrate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cratedig_local_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "../../packages/engine"]

[tool.uv.sources]
cratedig-engine = { path = "../../packages/engine", editable = true }
rekordbox-pdb = { git = "https://github.com/fragmede/rekordbox-pdb.git" }
